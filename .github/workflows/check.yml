name: Check
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install Redis for isolated integration tests
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: npm run test:redis
      - run: npm run test:http
      - name: Check Docker packaging
        run: docker build -t agent-sentinel:test .
